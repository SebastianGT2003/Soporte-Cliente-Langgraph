[project]
name = "soporte-cliente"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sebas", email = "sebastiangonzita@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-api-python-client>=2.202.0",
    "google-auth-httplib2>=0.4.4",
